name: Daily

# The autopilot loop. With AUTO_APPROVE=true this needs no human at all:
# generate premises, queue the top few, produce and publish them.
# With it unset, it opens the weekly gate issue instead and waits for you.
on:
  schedule:
    - cron: '0 6 * * *'    # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      count:
        description: How many videos to make this run
        default: '1'

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Install render dependencies
        if: vars.AUTO_APPROVE == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 || true

      # Fresh analytics first — the breaker is only as good as its data.
      - name: Pull metrics
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npm run metrics

      # ---- Autopilot: no human in the loop ----
      - name: Generate and queue
        if: vars.AUTO_APPROVE == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
        run: npm run ideate 12 -- --auto ${{ inputs.count || vars.DAILY_COUNT || '1' }}

      - name: Produce and publish
        if: vars.AUTO_APPROVE == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          RETENTION_FLOOR: ${{ vars.RETENTION_FLOOR || '30' }}
          RETENTION_WINDOW: ${{ vars.RETENTION_WINDOW || '10' }}
        run: npm run autopilot

      # ---- Gated: open the issue and stop ----
      - name: Generate premises for review
        if: vars.AUTO_APPROVE != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run ideate 20

      - name: Open the gate issue
        if: vars.AUTO_APPROVE != 'true' && github.event.schedule == '0 6 * * *'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const ideas = JSON.parse(fs.readFileSync('state/ideas.json', 'utf8'));
            const week = new Date().toISOString().slice(0, 10);
            const body = [
              'Tick the premises you want made, edit the angles inline, then close this issue.',
              '',
              ...ideas.map(i => `- [ ] \`${i.id}\` **${i.hook}**\n      ${i.premise}`),
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Selection gate — ${week}`, body, labels: ['selection-gate'],
            });

      - name: Explain a held run
        if: failure()
        run: |
          echo "::warning::If the run stopped with exit code 2, the retention"
          echo "::warning::breaker held publishing. See the 'Produce' step log."

      - name: Keep the videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_number }}
          path: out/**/video.mp4
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit state
        if: always()
        run: |
          git config user.name  "yt-autopilot"
          git config user.email "actions@github.com"
          git add state/
          git diff --staged --quiet || git commit -m "chore: run $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash && git push
